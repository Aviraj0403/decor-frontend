<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Premium Deep Teal Background -->
  <rect width="512" height="512" rx="128" fill="#103438"/>
  
  <!-- Stylized Elegant Golden Monogram 'A' -->
  <g transform="translate(256, 265) scale(0.95)">
    <!-- Left Stem of A -->
    <path d="M-110 130 L-25 -130 C-20 -145 -10 -150 0 -150 C10 -150 20 -145 25 -130 L110 130 C115 145 105 160 90 160 C80 160 70 152 66 140 L43 70 L-43 70 L-66 140 C-70 152 -80 160 -90 160 C-105 160 -115 145 -110 130 Z" fill="url(#goldGradient)"/>
    
    <!-- Crossbar / Elegant Ribbon -->
    <path d="M-37 50 L37 50 L0 -60 Z" fill="#103438"/>
    <path d="M-40 40 L40 40 L0 -80 Z" fill="url(#goldGradientLight)"/>
    
    <!-- Inner Accent Diamond -->
    <polygon points="0,-10 20,25 -20,25" fill="#103438"/>
  </g>
  
  <!-- Definitions for Gradients -->
  <defs>
    <!-- Rich Golden Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8A663E"/>
      <stop offset="30%" stop-color="#C99665"/>
      <stop offset="50%" stop-color="#F2D1A9"/>
      <stop offset="70%" stop-color="#C99665"/>
      <stop offset="100%" stop-color="#8A663E"/>
    </linearGradient>
    
    <!-- Light Golden Accent Gradient -->
    <linearGradient id="goldGradientLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D1A9"/>
      <stop offset="50%" stop-color="#C99665"/>
      <stop offset="100%" stop-color="#8A663E"/>
    </linearGradient>
  </defs>
</svg>